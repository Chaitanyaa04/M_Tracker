name: Generate signing key (run ONCE, then delete this file)
on: workflow_dispatch
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Create keystore
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore release.jks -alias mtracker -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=M_Tracker, O=Personal, C=IN"
          {
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_PASSWORD=$PASS"
            echo "KEY_ALIAS=mtracker"
            echo "KEYSTORE_B64 (everything on the next line):"
            base64 -w0 release.jks
            echo
          } > keystore-secrets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: signing-key-secrets
          path: keystore-secrets.txt
          retention-days: 1
