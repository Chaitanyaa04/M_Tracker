name: Autofill build (removed)

# The autofill product flavor was removed in commit 565bde3.
# This workflow is kept only to give a clear error instead of failing with an
# unknown Gradle task. Use "Build & release Arthak" (.github/workflows/build.yml).
on: workflow_dispatch

permissions:
  contents: read

jobs:
  notice:
    runs-on: ubuntu-latest
    steps:
      - name: Explain removal
        run: |
          echo "::error::The autofill flavor no longer exists. Use .github/workflows/build.yml instead."
          exit 1
