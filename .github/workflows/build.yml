name: Build & release Arthak

on:
  push:
    tags: ["v*"]          # push a tag like v1.3.0 to publish an update
  workflow_dispatch: {}   # or run by hand for a test build

permissions:
  contents: write         # lets the workflow create the GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_B64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }

      - name: Work out the version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V="0.0.${GITHUB_RUN_NUMBER}-test"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"

      - name: Decode signing key
        if: env.HAS_KEY == 'true'
        env: { KEYSTORE_B64: "${{ secrets.KEYSTORE_B64 }}" }
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleStandardRelease --no-daemon -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ github.run_number }}

      - name: Build debug APK (no signing key yet)
        if: env.HAS_KEY != 'true'
        run: gradle assembleStandardDebug --no-daemon -PversionName=${{ steps.ver.outputs.name }} -PversionCode=${{ github.run_number }}

      - name: Name the APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/standard/*/*.apk "dist/Arthak-${{ steps.ver.outputs.name }}.apk"

      - uses: actions/upload-artifact@v4
        with: { name: Arthak-apk, path: dist/*.apk, if-no-files-found: error }

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
