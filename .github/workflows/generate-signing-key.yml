name: Generate signing key (run ONCE, then delete this file)
# SECURITY: this workflow must NEVER upload the private keystore or its password as an
# artifact — artifacts are readable by anyone with access to the repo runs. Instead it
# prints only the PUBLIC certificate fingerprint; you store the keystore itself locally
# (keep a copy in a password manager / offline backup).
on: workflow_dispatch
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - name: Install JDK
        run: sudo apt-get update && sudo apt-get install -y openjdk-17-jre-headless

      - name: Create keystore (output goes ONLY to the secure step summary — not the plain log)
        run: |
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -v -keystore release.jks -alias mtracker -keyalg RSA -keysize 2048 \
            -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Arthak, O=Personal, C=IN" >/dev/null 2>&1
          {
            echo "### SAVE THESE NOW, THEN DELETE THIS RUN"
            echo '```'
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=mtracker"
            echo "KEYSTORE_B64 on one line:"
            base64 -w0 release.jks
            echo "-----END-----"
            echo '```'
            echo "PUBLIC CERT FINGERPRINT (safe to share / document):"
            echo '```'
            keytool -list -v -keystore release.jks -storepass "$PASS" | grep -i "SHA256:" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -f release.jks
